<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Radix Colors Importer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 12px;
      color: var(--figma-color-text);
      display: flex;
      flex-direction: column;
    }

    .plugin-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .footer-area {
      border-top: 1px solid var(--figma-color-border);
      padding: 16px;
      background: var(--figma-color-bg);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }

    h3 {
      margin: 16px 0 8px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--figma-color-text-secondary);
    }

    .section {
      margin-bottom: 20px;
    }

    .radio-group, .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    label:hover {
      background: var(--figma-color-bg-hover);
    }

    label.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    label.disabled:hover {
      background: transparent;
    }

    input[type="radio"],
    input[type="checkbox"] {
      cursor: pointer;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
    }

    select:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .collection-option {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .step-header h2 {
      margin: 0;
    }

    .step-header .button-group {
      margin: 0;
    }

    .color-counter {
      font-size: 11px;
      color: var(--figma-color-text-secondary);
      margin-bottom: 8px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-preview {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid var(--figma-color-border);
      flex-shrink: 0;
    }

    .category-header {
      grid-column: 1 / -1;
      font-weight: 600;
      margin-top: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--figma-color-border);
      color: var(--figma-color-text-secondary);
    }

    .category-header:first-child {
      margin-top: 0;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 16px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
    }

    button:hover {
      background: #0d8fe0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
      border: 1px solid var(--figma-color-border);
    }

    button.secondary:hover {
      background: var(--figma-color-bg-hover);
    }

    .variants-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .error {
      color: #e54d2e;
      font-size: 11px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="plugin-container">
    <div class="content-area">
      <div class="section">
        <h2>Step 1: Choose Collection</h2>
        <div class="collection-grid">
          <div class="collection-option">
            <label>
              <input type="radio" name="collectionMode" value="new" checked>
              Create new collection
            </label>
            <input type="text" id="collectionName" placeholder="Collection name" value="Primitive Color">
          </div>
          <div class="collection-option">
            <label id="existingCollectionLabel">
              <input type="radio" name="collectionMode" value="existing" id="existingCollectionRadio">
              Use existing collection
            </label>
            <select id="existingCollection" disabled>
              <option value="">Loading...</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="step-header">
          <h2>Step 2: Select Colors</h2>
          <div class="button-group">
            <button class="secondary" id="selectAll">Select All</button>
            <button class="secondary" id="deselectAll">Deselect All</button>
          </div>
        </div>
        <div id="jsCheck" style="background: #f8d7da; padding: 8px; margin-bottom: 8px; font-size: 11px; border-radius: 4px; color: #721c24;">⚠️ JavaScript not loaded yet...</div>
        <div id="debugInfo" style="background: #fff3cd; padding: 8px; margin-bottom: 8px; font-size: 11px; border-radius: 4px; display: none;"></div>
        <div class="color-counter" id="colorCounter">0 of 34 colors selected</div>
        <div class="color-grid" id="colorGrid">
          <!-- Colors will be populated by JavaScript -->
        </div>
      </div>

      <div class="section">
        <h2>Step 3: Select Variants</h2>
        <div class="variants-grid checkbox-group">
          <label>
            <input type="checkbox" name="variant" value="light" checked>
            Light
          </label>
          <label>
            <input type="checkbox" name="variant" value="lightAlpha">
            Light Alpha
          </label>
          <label>
            <input type="checkbox" name="variant" value="dark">
            Dark
          </label>
          <label>
            <input type="checkbox" name="variant" value="darkAlpha">
            Dark Alpha
          </label>
        </div>
        <div class="error" id="variantError" style="display: none;">
          Please select at least one variant
        </div>
      </div>
    </div>

    <div class="footer-area">
      <button id="importButton" disabled>Import Colors</button>
      <div class="error" id="importError" style="display: none;"></div>
    </div>
  </div>

  <script src="ui.ts"></script>
</body>
</html>
